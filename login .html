<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>From Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">


    <style>
        .full-page-gradient {
            height: 100vh;
            background: linear-gradient(135deg, #f70000 0%, #f3d111 100%);
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>

</head>

<body class="full-page-gradient"></body>
<script>
    if (!sessionStorage.getItem("sudahMuncul")) {
        window.alert("Selamat Datang di Halaman Login!");
        sessionStorage.setItem("sudahMuncul", "true");
    }
</script>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-4">
            <div class="card p-5">
                <div class="card-body">
                    <h4 class="text-center mb-4">Login</h4>
                    <form>
                        <div class="mb-3">
                            <label for="username" class="form-label">Username</label>
                            <input type="text" class="form-control" id="username" placeholder="Masukkan username">
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" class="form-control" id="password" placeholder="Masukkan password">
                        </div>
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary">Login</button>
                            <button type="button" class="btn btn-secondary">Reset</button>
                    </form>

                    <p class="text-center mt-3">
                        belom punya akun?
                        <a href="daftar .html">buat</a>
                    </p>

                    </div>
                </div>
            </div>
        </div>
    </div>

</html>
